
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Language Coach — Phòng Luyện Phát Âm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@500;600;700;800&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12201a;
    --bg-deep: #0b1510;
    --card: #1a2b22;
    --card-line: #22392c;
    --chalk: #f4efe1;
    --chalk-dim: #b9c9bd;
    --gold: #e3c16f;
    --gold-soft: rgba(227,193,111,.28);
    --coral: #ee7a67;
    --coral-soft: rgba(238,122,103,.25);
    --sage: #7fae8f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    color: var(--chalk);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
    background:
      radial-gradient(circle at 15% 10%, rgba(227,193,111,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(127,174,143,0.08), transparent 45%),
      var(--bg-deep);
    background-attachment: fixed;
  }

  .app-container {
    position: relative;
    background: var(--bg);
    width: 100%;
    max-width: 860px;
    border-radius: 20px;
    padding: 24px 28px;
    border: 1px solid var(--card-line);
    box-shadow: 0 30px 60px -25px rgba(0,0,0,.7);
    display: flex; flex-direction: column; gap: 18px;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px dashed var(--card-line);
    padding-bottom: 12px;
  }
  .header .title-block h1 {
    font-family: 'Caveat', cursive;
    font-size: 32px; font-weight: 700; color: var(--gold); line-height: 1;
  }
  .status-badge {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; border: 1px solid;
  }
  .status-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-offline { background: rgba(238,122,103,.1); color: var(--coral); border-color: rgba(238,122,103,.35); }
  .status-offline .dot { background: var(--coral); }
  .status-online { background: rgba(127,174,143,.12); color: #a9d6b8; border-color: rgba(127,174,143,.45); }
  .status-online .dot { background: #6fe39a; box-shadow: 0 0 8px #6fe39a; animation: pulse-dot 1.4s infinite ease-in-out; }
  @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  /* --- CÔ GIÁO NHỎ LẠI --- */
  .stage-wrapper {
    position: relative;
    width: 100%; height: 140px; /* Thu nhỏ chiều cao */
    border-radius: 14px;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(ellipse at center, rgba(227,193,111,.08) 0%, transparent 70%), #10201a;
    border: 1px solid var(--card-line);
    overflow: hidden;
  }
  #avatarCanvas { width: 130px; height: 130px; } /* Thu nhỏ Canvas */
  .teacher-tag {
    position: absolute; bottom: 8px; right: 14px;
    background: var(--gold); color: #1a2b22;
    font-family: 'Caveat', cursive; font-size: 15px; font-weight: 700;
    padding: 2px 10px; border-radius: 4px;
  }

  /* --- KHUNG VĂN BẢN (KHU VỰC HỌC CÓ TEXT CỰC LỚN) --- */
  .box-container { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label {
    font-size: 12px; font-weight: 800; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1.2px;
  }
  .box {
    background: var(--card);
    border: 2px solid var(--card-line);
    border-radius: 14px;
    padding: 16px 20px;
    min-height: 110px; max-height: 220px; overflow-y: auto;
    font-family: 'Space Mono', monospace;
    font-size: 20px; /* TEXT THẬT LỚN */
    line-height: 1.5; color: var(--chalk);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
  }
  .box.you { border-left: 6px solid var(--sage); color: #e2f2e6; }
  .box.teacher { border-left: 6px solid var(--gold); color: #fff8e7; }

  /* --- INPUT CONTROLS --- */
  .grid-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-full { grid-column: span 2; }
  input, select {
    background: var(--card);
    border: 1.5px solid var(--card-line);
    color: var(--chalk);
    padding: 10px 12px;
    border-radius: 10px;
    outline: none; font-size: 13px;
  }
  input:focus, select:focus { border-color: var(--gold); }

  .controls { display: flex; gap: 12px; }
  button {
    flex: 1; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer;
    font-size: 14px; text-transform: uppercase; border: none;
  }
  #btnConnect { background: var(--gold); color: #1a2b22; }
  #btnConnect:disabled { opacity: .4; cursor: not-allowed; }
  #btnDisconnect { background: transparent; color: var(--coral); border: 1.5px solid var(--coral); }
  #btnDisconnect:disabled { opacity: .3; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="title-block">
      <h1>AI Language Coach</h1>
    </div>
    <div id="statusBadge" class="status-badge status-offline"><span class="dot"></span>Offline</div>
  </div>

  <!-- CÔ GIÁO THU NHỎ -->
  <div class="stage-wrapper">
    <canvas id="avatarCanvas" width="130" height="130"></canvas>
    <div class="teacher-tag">Cô giáo AI</div>
  </div>

  <!-- CHỖ HỌC VỚI PHÔNG CHỮ LỚN -->
  <div class="box-container">
    <div class="field">
      <label>🗣️ Bạn vừa nói:</label>
      <div id="sttOutput" class="box you">Chưa có dữ liệu...</div>
    </div>
    <div class="field">
      <label>👩‍🏫 Giáo viên nhận xét &amp; Hướng dẫn:</label>
      <div id="geminiOutput" class="box teacher">Sẵn sàng học... Hãy bấm kết nối!</div>
    </div>
  </div>

  <div class="grid-fields">
    <div class="field">
      <label>Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Dán API Key...">
    </div>
    <div class="field">
      <label>Ngôn ngữ</label>
      <select id="langSelect">
        <option value="English">🇺🇸 Tiếng Anh (English)</option>
        <option value="Japanese">🇯🇵 Tiếng Nhật (日本語)</option>
        <option value="Korean">🇰🇷 Tiếng Hàn (한국어)</option>
        <option value="Chinese">🇨🇳 Tiếng Trung (中文)</option>
        <option value="French">🇫🇷 Tiếng Pháp (Français)</option>
        <option value="German">🇩🇪 Tiếng Đức (Deutsch)</option>
      </select>
    </div>
    <div class="field field-full">
      <label>Chủ đề luyện tập</label>
      <select id="topicSelect">
        <option value="daily">💬 Giao tiếp hằng ngày</option>
        <option value="restaurant">🍽️ Nhà hàng &amp; Ẩm thực</option>
        <option value="travel">✈️ Du lịch &amp; Sân bay</option>
        <option value="work">💼 Công sở &amp; Phỏng vấn</option>
        <option value="shopping">🛍️ Mua sắm</option>
        <option value="school">🎓 Trường học</option>
        <option value="health">🏥 Sức khỏe &amp; Bác sĩ</option>
        <option value="free">🎲 Để cô tự chọn theo trình độ</option>
      </select>
    </div>
  </div>

  <div class="controls">
    <button id="btnConnect">🎤 Bắt đầu luyện nói</button>
    <button id="btnDisconnect" disabled>⏹ Bảo cô dừng</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.17.0"
  }
}
</script>

<script type="module">
import { GoogleGenAI, Modality } from "@google/genai";

const apiKeyInput = document.getElementById('apiKey');
const topicSelect = document.getElementById('topicSelect');
const langSelect = document.getElementById('langSelect');

const TOPICS = {
  daily:      { label: "Giao tiếp hằng ngày",     desc: "chào hỏi, làm quen, trò chuyện thường ngày" },
  restaurant: { label: "Nhà hàng & Ẩm thực",       desc: "gọi món, đặt bàn, hỏi về món ăn" },
  travel:     { label: "Du lịch & Sân bay",        desc: "làm thủ tục bay, hỏi đường, đặt phòng" },
  work:       { label: "Công sở & Phỏng vấn",      desc: "phỏng vấn xin việc, họp hành" },
  shopping:   { label: "Mua sắm",                  desc: "hỏi giá, mặc cả, đổi trả hàng" },
  school:     { label: "Trường học",               desc: "giao tiếp trong lớp, hỏi bài" },
  health:     { label: "Sức khỏe & Bác sĩ",        desc: "mô tả triệu chứng, khám bệnh" },
  free:       { label: "Tự do",                    desc: "cô giáo tự chọn chủ đề" },
};

const btnConnect = document.getElementById('btnConnect');
const btnDisconnect = document.getElementById('btnDisconnect');
const sttOutput = document.getElementById('sttOutput');
const geminiOutput = document.getElementById('geminiOutput');
const statusBadge = document.getElementById('statusBadge');
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');

apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
apiKeyInput.onchange = () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());

const GEMINI_MODEL = "gemini-3.1-flash-live-preview";
let session = null, micStream = null, audioContext = null, micSource = null, processor = null;
let playbackContext = null, analyser = null, animFrameId = null;
let nextPlayTime = 0, isAiSpeaking = false, userBuffer = "", aiBuffer = "";

const anim = { mouthCurrent: 0, mouthTarget: 0, blinking: false, blinkStart: 0, blinkTimer: 2, eyeOpen: 1, lastTime: performance.now() };

function drawHumanAvatar() {
  const t = performance.now() / 1000;
  const cx = 65, cyBase = 65; // Điều chỉnh tâm cho canvas 130x130
  const breathe = Math.sin(t * 1.1) * 1;
  const cy = cyBase + breathe;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.scale(0.55, 0.55); // Tỷ lệ thu nhỏ vẽ nhân vật
  ctx.translate(52, 52);

  // Tóc sau
  ctx.fillStyle = "#3a2418";
  ctx.beginPath(); ctx.arc(cx, cy - 8, 76, 0, Math.PI * 2); ctx.fill();

  // Cổ & Áo
  ctx.fillStyle = "#e7b088"; ctx.fillRect(cx - 16, cy + 50, 32, 42);
  ctx.fillStyle = "#e3c16f";
  ctx.beginPath(); ctx.ellipse(cx, cy + 108, 62, 32, 0, 0, Math.PI * 2); ctx.fill();

  // Mặt
  ctx.fillStyle = "#ffe3c2";
  ctx.beginPath(); ctx.ellipse(cx, cy, 53, 65, 0, 0, Math.PI * 2); ctx.fill();

  // Tóc trước
  ctx.fillStyle = "#3a2418";
  ctx.beginPath(); ctx.arc(cx, cy - 24, 55, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();

  // Mắt
  const eo = Math.max(0.06, anim.eyeOpen);
  ctx.fillStyle = "#fff9f0";
  ctx.beginPath();
  ctx.ellipse(cx - 22, cy - 8, 10, 7 * eo, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + 22, cy - 8, 10, 7 * eo, 0, 0, Math.PI * 2);
  ctx.fill();
  if (eo > 0.25) {
    ctx.fillStyle = "#2c1b3d";
    ctx.beginPath(); ctx.arc(cx - 22, cy - 8, 4.6 * eo, 0, Math.PI * 2); ctx.arc(cx + 22, cy - 8, 4.6 * eo, 0, Math.PI * 2); ctx.fill();
  }

  // Miệng
  const mouthY = cy + 33;
  const openness = anim.mouthCurrent;
  const openPx = 3 + openness * 24;
  ctx.fillStyle = "#6b1724";
  ctx.beginPath();
  ctx.ellipse(cx, mouthY, 15, openPx / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function updateLipSync() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - anim.lastTime) / 1000);
  anim.lastTime = now;

  if (analyser && isAiSpeaking) {
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    anim.mouthTarget = Math.min(1, (sum / dataArray.length) / 70);
  } else {
    anim.mouthTarget = 0;
  }
  anim.mouthCurrent += (anim.mouthTarget - anim.mouthCurrent) * 0.3;

  drawHumanAvatar();
  animFrameId = requestAnimationFrame(updateLipSync);
}

function bytesToBase64(bytes){
  let binary=""; const chunkSize=0x8000;
  for(let i=0;i<bytes.length;i+=chunkSize){ binary += String.fromCharCode(...bytes.subarray(i, Math.min(i+chunkSize, bytes.length))); }
  return btoa(binary);
}
function floatTo16BitPCM(float32){
  const out = new Int16Array(float32.length);
  for(let i=0;i<float32.length;i++){ const s=Math.max(-1,Math.min(1,float32[i])); out[i]=s<0?s*0x8000:s*0x7fff; }
  return new Uint8Array(out.buffer);
}
function base64ToBytes(base64){
  const binary=atob(base64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function initPlaybackAudio() {
  if (!playbackContext) {
    playbackContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = playbackContext.createAnalyser();
    analyser.fftSize = 64;
    analyser.connect(playbackContext.destination);
  }
  if (playbackContext.state === "suspended") playbackContext.resume();
}

function playPCM24k(base64){
  initPlaybackAudio();
  isAiSpeaking = true;
  const bytes = base64ToBytes(base64);
  const samples = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));
  const buffer = playbackContext.createBuffer(1, samples.length, 24000);
  const channel = buffer.getChannelData(0);
  for(let i = 0; i < samples.length; i++){ channel[i] = samples[i] / 32768; }

  const source = playbackContext.createBufferSource();
  source.buffer = buffer;
  source.connect(analyser);

  const now = playbackContext.currentTime;
  nextPlayTime = Math.max(nextPlayTime, now);
  source.start(nextPlayTime);
  nextPlayTime += buffer.duration;

  setTimeout(() => {
    if (playbackContext && playbackContext.currentTime >= nextPlayTime) isAiSpeaking = false;
  }, buffer.duration * 1000);
}

async function startMicrophone(){
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();
  micSource = audioContext.createMediaStreamSource(micStream);
  processor = audioContext.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!session || isAiSpeaking) return;
    const pcm = floatTo16BitPCM(e.inputBuffer.getChannelData(0));
    session.sendRealtimeInput({ audio: { data: bytesToBase64(pcm), mimeType: `audio/pcm;rate=${audioContext.sampleRate}` } });
  };
  micSource.connect(processor); processor.connect(audioContext.destination);
}

async function stopMicrophone(){
  try{ processor?.disconnect(); micSource?.disconnect(); }catch{}
  processor = null; micSource = null;
  if(micStream) micStream.getTracks().forEach(t => t.stop());
  if(audioContext) await audioContext.close().catch(()=>{});
}

async function startLiveSession() {
  const key = apiKeyInput.value.trim();
  if (!key) return alert("Vui lòng nhập API Key!");

  try {
    statusBadge.innerHTML = '<span class="dot"></span>Connecting...';
    statusBadge.className = "status-badge status-offline";
    btnConnect.disabled = true;
    userBuffer = ""; aiBuffer = ""; sttOutput.textContent = "";

    const selectedLang = langSelect.value;
    const selectedTopicKey = topicSelect.value;
    const topicObj = TOPICS[selectedTopicKey] || TOPICS.daily;

    const ai = new GoogleGenAI({ apiKey: key });

    session = await ai.live.connect({
      model: GEMINI_MODEL,
      config: {
        responseModalities: [Modality.AUDIO],
        inputAudioTranscription: {},
        outputAudioTranscription: {},
        systemInstruction: {
          parts: [{
            text: `Bạn là giáo viên dạy phát âm chuẩn chuyên dạy ngôn ngữ: ${selectedLang}.
                   Chủ đề hôm nay: "${topicObj.label}" (${topicObj.desc}).
                   Nhiệm vụ:
                   1. Bắt đầu bằng việc chào và đưa ra 1 câu mẫu ngắn bằng ${selectedLang} theo chủ đề.
                   2. Nghe học viên đọc, sửa lỗi phát âm và khẩu hình chi tiết BẰNG TIẾNG VIỆT.
                   3. Giữ câu trả lời súc tích để phản hồi nhanh.`
          }]
        }
      },
      callbacks: {
        onopen() {
          statusBadge.innerHTML = '<span class="dot"></span>Online (Live)';
          statusBadge.className = "status-badge status-online";
          btnDisconnect.disabled = false;
          geminiOutput.textContent = `🟢 Sẵn sàng! Đang tải bài học chủ đề ${topicObj.label}...`;
        },
        onmessage(message) {
          const sc = message.serverContent;
          if (sc?.inputTranscription?.text) { userBuffer += sc.inputTranscription.text; sttOutput.textContent = userBuffer; }
          if (sc?.outputTranscription?.text) { aiBuffer += sc.outputTranscription.text; geminiOutput.textContent = aiBuffer; }
          const parts = sc?.modelTurn?.parts || [];
          for (const part of parts) {
            const data = part?.inlineData?.data || part?.inline_data?.data;
            const mime = part?.inlineData?.mimeType || part?.inline_data?.mimeType || "";
            if (data && mime.startsWith("audio/")) playPCM24k(data);
          }
          if (sc?.turnComplete || sc?.interrupted) {
            isAiSpeaking = false; userBuffer = ""; aiBuffer = "";
          }
        },
        onerror(e) { geminiOutput.textContent = "❌ Lỗi: " + e.message; stopSession(); },
        onclose() { stopSession(); }
      }
    });

    await startMicrophone();
  } catch (err) { geminiOutput.textContent = "❌ Lỗi khởi tạo: " + err.message; stopSession(); }
}

async function stopSession() {
  try { session?.sendRealtimeInput?.({ audioStreamEnd: true }); session?.close?.(); } catch {}
  session = null; await stopMicrophone();
  isAiSpeaking = false;

  statusBadge.innerHTML = '<span class="dot"></span>Offline';
  statusBadge.className = "status-badge status-offline";
  btnConnect.disabled = false; btnDisconnect.disabled = true;
}

btnConnect.onclick = startLiveSession;
btnDisconnect.onclick = stopSession;

updateLipSync();
</script>
</body>
</html>
