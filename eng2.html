<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phiên dịch Việt · Anh · Nhật</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--a:#e11d48;--b:#2563eb;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mut:#9aa0a6;--bd:#2a2f38}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:16px/1.5 system-ui,"Noto Sans JP","Hiragino Sans",sans-serif;background:var(--bg);color:var(--tx)}
input,select,button{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button.go{background:var(--b);color:#fff;border:0;font-weight:600}
button.go.on{background:var(--a)}
#stage{height:100dvh;display:flex;flex-direction:column}
.half{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.half.guest{transform:rotate(180deg)}           /* màn trên: xoay 180° quay về phía khách */
.hd{padding:6px 14px;font-size:13px;color:var(--mut);font-weight:600}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--mut);text-align:center;margin:auto;font-size:15px}
.msg{padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);border-left:6px solid #888}
.msg.ja{border-left-color:var(--a)}.msg.vi{border-left-color:var(--b)}.msg.en{border-left-color:#16a34a}
.msg .main{font-weight:700;font-size:clamp(20px,4.2vw,34px);line-height:1.3;white-space:pre-wrap;word-break:break-word}
.msg .sub{color:var(--mut);font-size:clamp(13px,2.2vw,17px);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.msg:first-child .main{font-size:clamp(30px,7vw,64px)}   /* câu mới nhất ở trên cùng, chữ to nhất */
.msg:not(:first-child){opacity:.72}
.mid{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border-top:2px solid var(--bd);border-bottom:2px solid var(--bd)}
.mid #stt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--mut)}
.meter{width:70px;height:8px;background:var(--bd);border-radius:4px;overflow:hidden;flex:0 0 auto}
.meter i{display:block;height:100%;width:0;background:#22c55e;transition:width .08s}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#drawer.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h2{font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px}
.row input[type=password]{flex:1;min-width:200px}
.row label{display:flex;gap:6px;align-items:center}
/* ---- giao diện mobile: chọn ngôn ngữ ngay trên màn hình, chữ to ---- */
button,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.row[hidden]{display:none}
#stage{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.half.guest{background:color-mix(in srgb,var(--a) 7%,var(--bg))}
.half.holder{background:color-mix(in srgb,var(--b) 7%,var(--bg))}
.hd{padding:8px 14px 4px;font-size:clamp(16px,4.2vw,20px);color:var(--tx);font-weight:700}
.chips{display:flex;gap:8px}
.chip{flex:1;min-width:0;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 8px;font-size:clamp(17px,4.8vw,22px);font-weight:700;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx)}
.chip .fl{font-size:1.35em;line-height:1}
.prow{display:flex;align-items:center;gap:10px}
.prow b{flex:0 0 74px;font-size:15px}
.prow.h b{color:var(--b)}.prow.g b{color:var(--a)}
.prow.h .chip.on{background:var(--b);border-color:var(--b);color:#fff}
.prow.g .chip.on{background:var(--a);border-color:var(--a);color:#fff}
.prow .chips{flex:1;min-width:0}
.chip{white-space:nowrap}
.mid .chip{min-height:44px;padding:6px 4px;font-size:clamp(16px,4.4vw,20px)}
.empty{font-size:clamp(20px,5.4vw,30px);font-weight:600;padding:0 16px}
.msg{padding:12px 16px;border-radius:18px;border-left-width:8px}
.msg .main{font-size:clamp(24px,6.2vw,44px)}
.msg:first-child .main{font-size:clamp(34px,9.5vw,76px)}
.msg .sub{font-size:clamp(15px,3.8vw,20px)}
.msg:not(:first-child){opacity:.6}
.mid{flex-direction:column;align-items:stretch;gap:8px;padding:8px 12px}
.mrow{display:flex;align-items:center;gap:10px}
.mid .meter{flex:0 0 90px;height:10px;border-radius:5px}
.mid #stt{flex:1;font-size:15px}
.mid button{min-width:56px;min-height:56px;border-radius:16px;font-size:22px}
.mid #btn{flex:1;font-size:20px}
.sheet select,.sheet button,.sheet input{min-height:44px}
/* ---- gọn: nhường chỗ cho chữ dịch ---- */
.hd{padding:4px 12px 2px;font-size:13px;opacity:.85}
#pair{display:flex;gap:8px}
.prow{flex:3;gap:6px;min-width:0}.prow.g{flex:2}
.prow b{flex:0 0 auto;font-size:12px}
.prow .chips{gap:4px}
.mid{gap:6px;padding:6px 10px}
.mid .chip{min-height:38px;padding:4px 2px;font-size:clamp(14px,3.8vw,17px);border-radius:10px}
.mid .meter{flex:0 0 50px;height:6px}
.mid #stt{font-size:12px}
.mrow{gap:8px}
.mid button{min-width:46px;min-height:46px;border-radius:12px;font-size:18px}
.mid #btn{font-size:17px}
.list{padding:2px 10px 8px;gap:8px}
.msg{padding:8px 12px;border-radius:14px}
.msg .main{font-size:clamp(26px,7vw,48px)}
.msg:first-child .main{font-size:clamp(38px,11vw,84px)}
.msg .sub{font-size:clamp(12px,3.2vw,16px);margin-top:2px}
.empty{font-size:clamp(18px,4.8vw,26px)}
.msg.draft .main{color:var(--mut)}
.msg.draft{border-left-style:dashed}
.msg.draft.k_tr .sub{display:none}
#pc{flex:0 0 auto;font-weight:800;font-size:13px;color:var(--a)}
#pc:empty{display:none}
#turn{flex:0 0 auto;min-height:38px;min-width:0;padding:4px 10px;font-size:15px}
#turn[hidden],.meter[hidden]{display:none}
/* ---- cuộn mượt & dễ đọc (PC + mobile) ---- */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.half{position:relative}
.list{position:relative;overflow-anchor:none;                 /* tự bù vị trí bằng JS, mọi trình duyệt đều giống nhau */
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  scrollbar-width:thin;scrollbar-color:var(--bd) transparent;scrollbar-gutter:stable;  /* thanh cuộn không làm chữ xuống dòng lại */
  padding-bottom:24px}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.msg{flex:0 0 auto;transition:opacity .35s ease;animation:msgIn .28s ease-out}
@keyframes msgIn{from{opacity:0}}
.msg .main{line-height:1.38;letter-spacing:.005em;line-break:strict}
.msg .sub{line-height:1.4}
.msg:not(:first-child){opacity:.82}
.msg.draft{opacity:1}
.topbtn{position:absolute;top:30px;right:12px;z-index:3;min-height:36px;padding:4px 12px;border-radius:18px;
  border:0;background:var(--b);color:#fff;font-size:14px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.topbtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.msg{animation:none;transition:none}}
</style>
</head>
<body>
<div id="stage">
  <section class="half guest"><div class="hd" id="hd_guest"></div><button class="topbtn" data-for="list_guest" hidden>↑ Mới nhất</button><div class="list" id="list_guest"></div></section>
  <div class="mid">
    <div id="pair"></div>
    <div class="mrow"><div class="meter"><i id="lv"></i></div><span id="pc"></span><button id="turn" class="chip" hidden title="Chạm để đổi người đang nói"></button><span id="stt">Chưa chạy</span></div>
    <div class="mrow"><button id="clr" title="Xoá chữ">🗑</button><button id="btn" class="go">▶ Bắt đầu</button><button id="snd" title="Bật/tắt đọc ra loa">🔊</button><button id="fs" title="Toàn màn hình">⛶</button><button id="gear" title="Cài đặt">⚙️</button></div>
  </div>
  <section class="half holder"><div class="hd" id="hd_holder"></div><button class="topbtn" data-for="list_holder" hidden>↑ Mới nhất</button><div class="list" id="list_holder"></div></section>
</div>

<div id="drawer"><div class="sheet">
<h2>Cài đặt <button id="closeset">Đóng</button></h2>
<div class="row">
<input id="key" type="password" placeholder="Gemini API key">
<input id="model" list="ml" value="gemini-3.5-flash" style="flex:0 0 190px;min-width:150px" title="Tên model"><datalist id="ml"><option value="gemini-3.5-flash"><option value="gemini-3.5-flash-lite"><option value="gemini-3.6-flash"><option value="gemini-3.8-flash"><option value="gemini-2.5-flash"></datalist>
<button id="test">Kiểm tra kết nối</button><button id="spk">🔊 Thử loa</button>
</div>
<div id="conn" style="margin-bottom:10px;font-size:14px;color:var(--mut)">Chưa kiểm tra kết nối.</div>
<div class="row" hidden><b>Hai bên:</b>
<span>🧑 Người cầm (màn dưới): <select id="lang_holder"></select></span>
<span>🧑‍💼 Khách (màn trên, xoay ngược): <select id="lang_guest"></select></span>
<button id="swap">⇄ Đổi bên</button></div>
<div class="row"><span>Chế độ: <select id="mode"><option value="live">Live – Gemini nghe, chữ hiện ngay khi nói</option><option value="seg">Thường – Gemini nghe từng đoạn</option></select></span></div>
<div class="row"><span>Bộ dịch: <select id="tr"><option value="browser">Trình duyệt – miễn phí (Gemini chỉ chép lời)</option><option value="gemini">Gemini – chuẩn hơn, tốn API hơn</option></select></span></div>
<div class="row"><span>Đọc ra loa: <select id="voice"><option value="both">Cả hai chiều</option><option value="guest">Chỉ đọc cho khách nghe</option><option value="holder">Chỉ đọc cho người cầm nghe</option><option value="off">Tắt tiếng (chỉ hiện chữ)</option></select></span></div>
<div class="row"><label><input type="checkbox" id="auto" checked>⚡ Tự bám tốc độ nói (nói nhanh → chữ &amp; tiếng cũng nhanh theo)</label></div>
<div class="row"><span>Mic khi loa đang đọc: <select id="duplex"><option value="open">Luôn mở – không mất lời (tự lọc tiếng vọng)</option><option value="mute">Tắt tạm (như cũ)</option></select></span></div>
<div class="row"><label><input type="checkbox" id="hp">🎧 Chế độ tai nghe (nghe tiếp khi đang phát, nhanh hơn)</label><span>Cắt câu: <select id="sil"><option value="300">Siêu nhanh</option><option value="450" selected>Nhanh</option><option value="600">Vừa</option><option value="900">Chậm</option></select></span><span>Độ nhạy mic: <select id="sens"><option value="0.004">Rất cao</option><option value="0.008" selected>Cao</option><option value="0.015">Vừa</option></select></span><span>Tốc độ đọc: <select id="rate"><option value="1">1x</option><option value="1.15" selected>1.15x</option><option value="1.3">1.3x</option></select></span></div>
<div id="dbg" style="font:12px/1.4 monospace;color:var(--mut);white-space:pre-wrap;word-break:break-all">Nhật ký: (trống)</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
try{$('key').value=localStorage.getItem('gk')||''}catch(e){}
let ctx,stream,proc,running=false;
let speaking=false,tts=false,mutedUntil=0,floor=0.002;
let seg=[],pre=[],silence=0,segLen=0;
let SIL=450;$('sil').onchange=()=>SIL=+$('sil').value;SIL=+$('sil').value;
const SR=16000,queue=[];let busy=false;

const LC={ja:'ja-JP',vi:'vi-VN',en:'en-US'},NM={ja:'🇯🇵 Nhật',vi:'🇻🇳 Việt',en:'🇬🇧 Anh'};
const OPTL={vi:'🇻🇳 Việt',en:'🇬🇧 Anh',ja:'🇯🇵 Nhật'};
function side(){return{holder:$('lang_holder').value,guest:$('lang_guest').value}}
// Hai bên nói chuyện qua lại; ngôn ngữ thứ ba (nếu có) cũng được dịch cho người cầm.
function getMap(){const {holder:h,guest:g}=side();const m={};for(const l of ['ja','vi','en'])m[l]=l===h?g:l===g?h:h;return m}
function savePair(){try{localStorage.setItem('pair2',JSON.stringify({...side(),voice:$('voice').value}))}catch(e){}}
const NAT={vi:'Tiếng Việt',en:'English',ja:'日本語'},FL={vi:'🇻🇳',en:'🇬🇧',ja:'🇯🇵'},
  HINT={vi:'Hãy nói tiếng Việt',en:'Please speak English',ja:'日本語で話してください'};
const SH={vi:'Việt',en:'English',ja:'日本語'};
const chipsHtml=(who,langs,cur)=>langs.map(l=>`<button class="chip${l===cur?' on':''}" data-w="${who}" data-l="${l}">${SH[l]}</button>`).join('');
// Chọn ngôn ngữ ngay trên màn hình: người cầm chọn 1 trong 3, khách chỉ thấy 2 ngôn ngữ còn lại.
function heads(){
  const {holder:h,guest:g}=side(),all=['vi','en','ja'];
  $('pair').innerHTML='<div class="prow h"><b>Tôi</b><div class="chips">'+chipsHtml('holder',all,h)+'</div></div><div class="prow g"><b>Khách</b><div class="chips">'+chipsHtml('guest',all.filter(l=>l!==h),g)+'</div></div>';
  $('hd_guest').textContent='🧑‍💼 Guest · お客様 · '+NAT[g];
  $('hd_holder').textContent='🧑 Tôi · '+NAT[h];
  for(const [k,X] of [['guest',g],['holder',h]]){
    const L=$('list_'+k),o=L.querySelector('.empty');if(o)o.remove();
    if(!L.querySelector('.msg')){const e=document.createElement('div');e.className='empty';e.textContent='🎙 '+HINT[X];L.appendChild(e)}
  }
}
function setLang(who,l){
  const a=$('lang_'+who),b=$('lang_'+(who==='holder'?'guest':'holder'));
  if(b.value===l)b.value=a.value;   // chọn trùng bên kia thì hoán đổi
  a.value=l;savePair();for(const k of ['guest','holder'])$('list_'+k).innerHTML='';heads();  // đổi ngôn ngữ thì xoá thẻ cũ để khỏi lẫn
}
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)setLang(c.dataset.w,c.dataset.l)});
(function(){
  let p={holder:'vi',guest:'ja',voice:'both'};try{p={...p,...JSON.parse(localStorage.getItem('pair2')||'{}')}}catch(e){}
  for(const id of ['lang_holder','lang_guest'])for(const k of ['vi','en','ja'])$(id).add(new Option(OPTL[k],k));
  $('lang_holder').value=p.holder;$('lang_guest').value=p.guest;$('voice').value=p.voice;
  const fix=(chg,other)=>{if($(chg).value===$(other).value)$(other).value=['vi','en','ja'].find(x=>x!==$(chg).value);savePair();heads()};
  $('lang_holder').onchange=()=>fix('lang_holder','lang_guest');
  $('lang_guest').onchange=()=>fix('lang_guest','lang_holder');
  $('voice').onchange=savePair;
  $('swap').onclick=()=>{const h=$('lang_holder').value;$('lang_holder').value=$('lang_guest').value;$('lang_guest').value=h;savePair();heads()};
  heads();
})();
// ---- cuộn mượt: giữ nguyên chỗ đang đọc, chỉ tự lên đầu khi đang ở đầu ----
const _ro={};
function _watch(L){
  return _ro[L.id]||(_ro[L.id]=new ResizeObserver(es=>{
    const top=L.scrollTop<=2;let d=0;
    for(const e of es){
      const el=e.target,h=el.offsetHeight,o=el._h;el._h=h;
      if(top||o==null||o===h)continue;
      if(el.offsetTop+o<=L.scrollTop+1)d+=h-o;      // thẻ nằm phía trên vùng đang đọc đổi chiều cao → bù lại
    }
    if(d)L.scrollTop+=d;
  }));
}
function keepView(L,el){
  const away=L.scrollTop>2,h0=L.scrollHeight;
  L.prepend(el);
  if(away)L.scrollTop+=L.scrollHeight-h0;           // đang đọc câu cũ: không giật
  else L.scrollTop=0;                               // đang ở đầu: bám câu mới nhất
  el._h=el.offsetHeight;_watch(L).observe(el);
}
document.querySelectorAll('.topbtn').forEach(b=>{
  const L=$(b.dataset.for);let t=0;
  const upd=()=>{t=0;b.hidden=L.scrollTop<90};
  L.addEventListener('scroll',()=>{if(!t)t=requestAnimationFrame(upd)},{passive:true});
  b.onclick=()=>L.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
});
// Mỗi câu = 1 thẻ ở màn nào hiểu được ngôn ngữ đó; câu mới luôn nằm trên cùng.
function newMsg(src,tg){
  const {holder,guest}=side(),parts=[];
  for(const [who,X] of [['guest',guest],['holder',holder]]){
    const kind=src===X?'orig':tg===X?'tr':null;if(!kind)continue;
    const L=$('list_'+who),emp=L.querySelector('.empty');if(emp)emp.remove();
    const el=document.createElement('div');el.className='msg '+src;
    el.innerHTML='<div class="main"></div><div class="sub"></div>';
    el.classList.add('k_'+kind);keepView(L,el);parts.push({el,kind});
  }
  return{draft(on){for(const p of parts)p.el.classList.toggle('draft',on)},rm(){for(const p of parts)p.el.remove()},set(orig,trans){for(const p of parts){p.el.querySelector('.main').textContent=p.kind==='orig'?orig:trans;p.el.querySelector('.sub').textContent=p.kind==='orig'?trans:orig}}};
}
function say(text,tg){
  const v=$('voice').value,{holder,guest}=side();
  if(v==='off'||(v==='guest'&&tg!==guest)||(v==='holder'&&tg!==holder))return;
  speak(text,LC[tg]);
}
// ---- giao diện ----
$('gear').onclick=()=>$('drawer').classList.add('open');
$('closeset').onclick=()=>$('drawer').classList.remove('open');
$('clr').onclick=()=>{for(const k of ['guest','holder'])$('list_'+k).innerHTML='';heads()};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
try{if(!$('key').value)$('drawer').classList.add('open')}catch(e){}
$('btn').addEventListener('click',()=>{
  setTimeout(()=>{if(running){$('drawer').classList.remove('open');try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}},700);
});
const API='https://generativelanguage.googleapis.com/v1beta/';
$('test').onclick=async()=>{
  const k=$('key').value.trim(),m=$('model').value.trim(),c=$('conn');
  if(!k){c.textContent='❌ Chưa nhập API key';return}
  c.textContent='⏳ Đang kiểm tra…';
  try{
    const r=await fetch(API+'models?pageSize=200&key='+encodeURIComponent(k));
    if(!r.ok){c.textContent='❌ Key không hợp lệ hoặc bị chặn: '+r.status+' '+(await r.text()).slice(0,120);return}
    const names=((await r.json()).models||[]).map(x=>x.name.replace('models/',''));
    const has=names.includes(m);
    const r2=await fetch(API+'models/'+m+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Trả lời đúng một chữ: OK'}]}]})});
    const t=await r2.text();
    if(r2.ok)c.textContent='✅ Kết nối được, model "'+m+'" hoạt động.';
    else c.textContent='⚠️ Key đúng nhưng model "'+m+'" lỗi '+r2.status+'. '+(has?'':'Model này không có trong danh sách. ')+'Model dùng được: '+names.filter(n=>/flash/.test(n)&&!/image|tts|live|embed/.test(n)).slice(0,8).join(', ');
  }catch(e){c.textContent='❌ Không kết nối được mạng/Google: '+e.message}
};
const dl=[];
function dbg(t){dl.push(new Date().toTimeString().slice(0,8)+' '+t);if(dl.length>6)dl.shift();$('dbg').textContent=dl.join('\n')}
function voiceInfo(){
  const v=speechSynthesis.getVoices();

function onAudio(e){
  const d=e.inputBuffer.getChannelData(0);
  let s=0;for(let i=0;i<d.length;i++)s+=d[i]*d[i];
  const rms=Math.sqrt(s/d.length);
  $('lv').style.width=Math.min(100,rms*600)+'%';
  const n0=performance.now();lastAudio=n0;
  if(rms===0){if(!zeroStart)zeroStart=n0}else zeroStart=0;
  const mt=muteMic();
  if(mt!==wasMuted){wasMuted=mt;$('lv').style.background=mt?'#f59e0b':'#22c55e';if(running)setStatus(mt?'🔊 Đang đọc (mic tạm tắt)':'Đang lắng nghe…')}
  if(live){pushPcm(muteMic()?new Float32Array(d.length):d);return}
  const dt=d.length/ctx.sampleRate*1000;
  if(muteMic()){seg=[];pre=[];speaking=false;silence=0;segLen=0;return}
  const eRisk=openEcho()&&(tts||performance.now()<mutedUntil+1000);
  const thr=Math.max(+$('sens').value,floor*3.5)*(eRisk?1.6:1);
  const frame=new Float32Array(d);
  if(rms>thr){
    if(!speaking){speaking=true;seg=pre.slice();segLen=0;setStatus('Đang nghe giọng nói…')}
    seg.push(frame);silence=0;segLen+=dt;if(eRisk)riskSeg=true;
  }else{
    if(!eRisk)floor=floor*0.97+rms*0.03;
    if(speaking){
      seg.push(frame);silence+=dt;segLen+=dt;if(eRisk)riskSeg=true;
      if(silence>silEff())endSeg();
    }else{pre.push(frame);if(pre.length>6)pre.shift()}
  }
  if(speaking&&segLen>10000)endSeg();
}
function endSeg(){
  const dur=segLen-silence;
  const fr=2048/ctx.sampleRate*1000,drop=Math.max(0,Math.floor((silence-150)/fr));
  const chunks=seg.slice(0,Math.max(1,seg.length-drop));seg=[];pre=[];speaking=false;silence=0;segLen=0;
  if(dur<280){setStatus('Đang lắng nghe…');return}
  dbg('Thu '+(dur/1000).toFixed(1)+'s → gửi Gemini');const wav=toWav(chunks,ctx.sampleRate);
  const risk=riskSeg;riskSeg=false;queue.push({wav,dur,risk});setStatus('Đang dịch…');pump();
}

function toWav(chunks,sr){
  let n=0;chunks.forEach(c=>n+=c.length);
  const all=new Float32Array(n);let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length});
  const ratio=sr/SR,len=Math.floor(n/ratio),pcm=new Int16Array(len);
  for(let i=0;i<len;i++){
    const a=Math.floor(i*ratio),b=Math.min(n,Math.floor((i+1)*ratio));
    let v=0,c=0;for(let j=a;j<b;j++){v+=all[j];c++}
    v=c?v/c:0;pcm[i]=Math.max(-1,Math.min(1,v))*32767;
  }
  const buf=new ArrayBuffer(44+pcm.length*2),dv=new DataView(buf);
  const w=(p,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(p+i,s.charCodeAt(i))};
  w(0,'RIFF');dv.setUint32(4,36+pcm.length*2,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);
  dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  let bin='';const u=new Uint8Array(buf);
  for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(bin);
}

async function webTr(text,sl,tg,draft){

  for(let i=0;i<2;i++){
    try{
      const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tg+'&dt=t&q='+encodeURIComponent(text),{signal:AbortSignal.timeout(8000)});
      if(r.status===429||r.status===403){coolUntil=performance.now()+20000;thr=Math.min(32,thr*2);showPace();dbg('⏳ Google Translate web đang giới hạn: nghỉ 20s');throw new Error(draft?'cooldown':'429')}
      if(!r.ok)throw new Error(r.status);
      const j=await r.json(),t=(j[0]||[]).map(x=>x[0]||'').join('').trim();
      if(t){onOk();return t}
      throw new Error('rỗng');
    }catch(e){err=e;
      if(e instanceof TypeError){  // 429/CORS từ file:// bị trình duyệt báo thành "Failed to fetch" → coi như bị giới hạn
        if(performance.now()>=coolUntil){coolUntil=performance.now()+20000;thr=Math.min(32,thr*2);showPace();dbg('⏳ Dịch web bị chặn/giới hạn: nghỉ 20s')}

      if(draft||e.message==='cooldown')break;await sleep(300)}
  }
  if(draft)throw err;

    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair='+sl+'|'+tg,{signal:AbortSignal.timeout(8000)});
    const j=await r.json(),t=j.responseData&&j.responseData.translatedText;
    if(j.responseStatus==200&&t&&!/MYMEMORY WARNING/i.test(t))return t.trim();

}

function pushPcm(d){

  rpos-=d.length;

  while(acc.length>=1600){

    for(let i=0;i<u.length;i+=0x4000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x4000));

async function gfetch(url,body,o={}){

  const now=performance.now(),fast=BT()&&chromeOK[(D.src||'')+'>'+(D.tg||'')]===true,gap=Math.max(fast?150:450,(fast?250:700)/P())*thr;
  if(now<coolUntil||gap>8000)return;
  if(now-lastSend<gap){if(!D.timer)D.timer=setTimeout(()=>{D.timer=null;draftTr()},gap-(now-lastSend));return}
  const txt=D.orig,b=D.bubble,tg=D.tg,sl=D.src;if(!b||!txt||txt===D.last)return;
  if(D.last&&txt.length-D.last.length<(D.src==='ja'?3:6)&&!/[。！？!?.]$/.test(txt))return;
  D.last=txt;lastSend=now;const my=++seqN;
  translateText(txt,tg,true,sl).then(tr=>{if(b===D.bubble&&my>applied){applied=my;D.trans=tr;D.transFor=txt;b.set(D.orig,tr);earlySay(tr,tg)}}).catch(e=>{if(e.message!=='cooldown')dbg('Dịch nháp lỗi '+e.message)});
}
function earlySay(tr,tg){
  if(P()<1.25||(!$('hp').checked&&$('duplex').value==='mute'))return;
  const s=splitSent(tr),ok=s.length-1;
  while(D.spk<ok){say(s[D.spk],tg);D.spk++}
}
function liveFinal(t){
  t=stripEcho(t.trim());const b=D.bubble,s0=D.src,prev=D.trans,tf=D.transFor,spk=D.spk,t0=D.t0,tl=D.tl,u=units(t,detect(t));
  clearTimeout(D.timer);Object.assign(D,{bubble:null,orig:'',trans:'',timer:null,last:'',src:null,transFor:''});resetT();
  const src=detect(t),tg=t&&getMap()[src];
  if(!tg){b&&b.rm();return}
  if(t0&&tl-t0>=800&&u>=4)setPace(u/((tl-t0+700)/1000),src,.3);
  let m=b;if(m&&s0!==src){m.rm();m=null}
  if(!m)m=newMsg(src,tg);
  m.draft(true);m.set(t,prev||'…');setStatus('Đang dịch…');
  const trP=prev&&nz(tf)===nz(t)?Promise.resolve(prev):translateText(t,tg,false,src).catch(e=>{dbg('Dịch lỗi '+e.message);return prev});
  fchain=fchain.then(async()=>{
    const tr=await trP;
    if(tr){m.set(t,tr);m.draft(false);const s=splitSent(tr);for(let i=Math.min(spk,s.length);i<s.length;i++)say(s[i],tg)}else{m.draft(false);m.set(t,'⚠️ Chưa dịch được')}
    if(running)setStatus('Đang lắng nghe…');
  });
}
const detect=t=>forced||(JP.test(t)?'ja':VN.test(t)?'vi':'en');
let forced=null;

async function runBT(it){
  const mp=getMap();
  const prompt=`You are a live transcriber. The audio has ONE speaker (vi/en/ja); ignore noise, music, background and echo.
Reply in this exact format:
line 1: language code of the speech (vi, en or ja), or none if there is no clear speech
line 2: the verbatim transcript in the original language, nothing else (never translate).
For none, print only: none`;
  const m=$('model').value.trim();
  const cfg=/gemini-3/.test(m)?{thinkingConfig:{thinkingLevel:'minimal'}}:/gemini-2\.5-flash/.test(m)?{thinkingConfig:{thinkingBudget:0},temperature:0}:{temperature:0};
  const res=await gfetch(`${API}models/${m}:generateContent?key=${encodeURIComponent($('key').value.trim())}`,
    JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'audio/wav',data:it.wav}}]}],generationConfig:cfg}),{timeout:30000});
  if(!res.ok){const t=await res.text();dbg('Lỗi API '+res.status+': '+t.slice(0,150));throw new Error(res.status+' '+t.slice(0,200))}
  const out=(((await res.json()).candidates?.[0]?.content?.parts)||[]).map(x=>x.text||'').join('').trim();
  const nl=out.indexOf('\n');let lang=(nl<0?out:out.slice(0,nl)).trim().toLowerCase();
  lang=(lang.match(/\b(vi|en|ja|none)\b/)||[lang])[0];
  const tg=mp[lang];dbg('Gemini nhận dạng: '+lang+(tg&&tg!=='none'?' → '+tg+' (dịch bằng trình duyệt)':' (bỏ qua)'));
  if(!tg||tg==='none')return;
  let orig=(nl<0?'':out.slice(nl+1)).trim();if(!orig)return;
  if(it.risk){const c=stripEcho(orig);if(!c){dbg('🔁 Bỏ tiếng vọng của loa');return}orig=c}
  const b=newMsg(lang,tg);b.draft(true);b.set(orig,'…');setStatus('Đang dịch…');
  const n=units(orig,lang);if(it.dur>=1500&&n>=4)setPace(n/(it.dur/1000),lang,.5);
  let tr='';try{tr=await translateText(orig,tg,false,lang)}catch(e){dbg('Dịch lỗi '+e.message)}
  b.draft(false);
  if(tr){b.set(orig,tr);for(const s of splitSent(tr))say(s,tg)}else b.set(orig,'⚠️ Chưa dịch được')
}
async function run(it){const b64=it.wav,dur=it.dur;
  const mp=getMap();
  const rules=Object.entries(mp).filter(([a,t])=>t!=='none').map(([a,t])=>`${LN[a]} speech → translate to ${LN[t]}`).join('; ');
  const prompt=`You are a live interpreter. The audio has ONE speaker (vi/en/ja); ignore noise, music, background and echo.
Rules: ${rules}.
Reply in this exact format:
line 1: language code of the speech (vi, en or ja), or none if there is no clear speech
then: the translation, written in the TARGET language (never copy the original words)
then a line containing only ###
then: the verbatim transcript in the original language.
For none, print only: none`;
  const m=$('model').value.trim();
  const cfg=/gemini-3/.test(m)?{thinkingConfig:{thinkingLevel:'minimal'}}:/gemini-2\.5-flash/.test(m)?{thinkingConfig:{thinkingBudget:0},temperature:0}:{temperature:0};
  const res=await gfetch(`${API}models/${m}:streamGenerateContent?alt=sse&key=${encodeURIComponent($('key').value.trim())}`,
    JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'audio/wav',data:b64}}]}],generationConfig:cfg}),{timeout:30000});
  if(!res.ok){const t=await res.text();dbg('Lỗi API '+res.status+': '+t.slice(0,150));throw new Error(res.status+' '+t.slice(0,200))}
  const rd=res.body.getReader(),dec=new TextDecoder();
  let buf='',full='',bubble=null,spoken=0,tg=null,lang=null,skip=false,bad=false,redo='';
  const SENT=/[\s\S]*?(?:[。！？!?\n]|\.(?=\s))/g;
  function update(final){
    if(skip||bad)return;
    const nl=full.indexOf('\n');
    if(nl<0&&!final)return;
    if(!lang){
      lang=(nl<0?full:full.slice(0,nl)).trim().toLowerCase();
      lang=(lang.match(/\b(vi|en|ja|none)\b/)||[lang])[0];
      tg=mp[lang];
      dbg('Gemini nhận dạng: '+lang+(tg&&tg!=='none'?' → '+tg:' (bỏ qua)'));
      if(!tg||tg==='none'){skip=true;return}
      setStatus('Đang dịch/phát…');
    }
    const rest=nl<0?'':full.slice(nl+1);
    const k=rest.indexOf('###');
    const trans=(k<0?rest:rest.slice(0,k)).trim();
    const orig=k<0?'':rest.slice(k+3).trim();
    if(!trans&&!final)return;
    if(!final&&k<0&&trans.length<12)return;
    if(it.risk){
      if(!final)return;
      const clean=stripEcho(orig);
      if(orig&&!clean){skip=true;dbg('🔁 Bỏ tiếng vọng của loa');return}
      if(clean&&clean!==orig){redo=clean;skip=true;return}
    }
    if(wrong(trans,tg)){bad=true;return}
    if(!bubble)bubble=newMsg(lang,tg);
    bubble.set(orig||'…',trans);
    const un=trans.slice(spoken);
    if(k>=0||final){if(un.trim()){say(un,tg)}spoken=trans.length}
    else{
      let end=0,m2;SENT.lastIndex=0;
      while((m2=SENT.exec(un)))end=SENT.lastIndex;
      if(end){const part=un.slice(0,end);if(part.trim())say(part,tg);spoken+=end}
    }
  }
  while(true){
    const {done,value}=await rd.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(!line.startsWith('data:'))continue;
      try{
        const j=JSON.parse(line.slice(5));
        const t=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
        if(t){full+=t;update(false)}
      }catch(e){}
    }
    if(skip){rd.cancel();break}
  }
  update(true);
  if(redo&&tg){const tr=await translateText(redo,tg);if(tr){bubble=newMsg(lang,tg);bubble.set(redo,tr);say(tr,tg)}}
  {const k=full.indexOf('###');if(k>=0&&lang&&dur>=1500){const o=full.slice(k+3).trim(),n=units(o,lang);if(n>=4)setPace(n/(dur/1000),lang,.5)}}
  if(bad){
    const nl=full.indexOf('\n'),rest=nl<0?'':full.slice(nl+1),j=rest.indexOf('###');
    const t1=(j<0?rest:rest.slice(0,j)).trim(),o1=j<0?'':rest.slice(j+3).trim(),src=o1||t1;
    dbg('Bản dịch sai ngôn ngữ → dịch lại bằng văn bản');
    const tr=src?await translateText(src,tg,false,lang):'';
    if(tr){if(!bubble)bubble=newMsg(lang,tg);bubble.set(src,tr);say(tr,tg)}
  }
}

let pend=0;const tq=[];let tplay=false;
function speak(text,lang){tq.push({text,lang});tts=true;pend=tq.length+(tplay?1:0);if(!tplay)playNext()}
function playNext(){
  if(!tq.length){tplay=false;pend=0;tts=false;ttsEnd=performance.now();mutedUntil=ttsEnd+Math.max(200,400/P());return}
  tplay=true;
  if(AUTO){const lim=tq[0].lang==='ja-JP'?140:300;let tot=0;for(const x of tq)tot+=x.text.length;
    while(tq.length>1&&tot>lim){tot-=tq.shift().text.length;dbg('⏩ Bỏ câu cũ để kịp theo')}}
  const f=tq.shift();let text=f.text,n=0;
  while(tq.length&&tq[0].lang===f.lang){text+=(f.lang==='ja-JP'?'':' ')+tq.shift().text;n++}
  const back=n+tq.length;pend=back+1;noteSpoken(text);
  const rate=Math.min(2.5,(+$('rate').value)*P()*(1+.12*Math.min(3,back)));
  const lang=f.lang,u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;
  const v=speechSynthesis.getVoices().find(x=>x.lang.replace('_','-').startsWith(lang.slice(0,2)));
  if(v)u.voice=v;
  speechSynthesis.resume();
  let fin=false,iv,to;
  const done=()=>{if(fin)return;fin=true;clearInterval(iv);clearTimeout(to);playNext()};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  const t0=performance.now();iv=setInterval(()=>{if(performance.now()-t0>1500&&!speechSynthesis.speaking&&!speechSynthesis.pending)done()},300);
  to=setTimeout(done,Math.max(5000,text.length*220/rate));
}
