<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>English Street Talk</title>
  <style>
    *{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:Arial,sans-serif;background:#9fc7e8}
    #hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:#fff}
    .top{display:flex;justify-content:space-between;padding:16px 18px;text-shadow:0 2px 8px #0008}
    .title{font-size:20px;font-weight:800;letter-spacing:.12em}
    .hint{font-size:12px;margin-top:4px;opacity:.85}
    #status{background:#0009;padding:8px 12px;border-radius:20px;font-size:12px}
    #subtitle{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);
      width:min(900px,88vw);min-height:42px;padding:10px 15px;text-align:center;
      background:#000a;border-radius:14px;font-size:16px;line-height:1.4}
    #npcBox{position:absolute;left:50%;bottom:178px;transform:translateX(-50%);
      display:none;align-items:center;gap:10px;padding:10px 14px;background:#000b;
      border:1px solid #fff4;border-radius:14px;backdrop-filter:blur(8px)}
    #npcName{font-weight:800}
    #talk{background:#ffd84d;color:#111}
    .npcLabel{position:absolute;transform:translate(-50%,-100%);padding:4px 8px;
      border-radius:8px;background:#000a;color:#fff;font-size:11px;pointer-events:none;
      white-space:nowrap;font-weight:700}
    #chatLogToggle{position:fixed;right:18px;top:112px;pointer-events:auto;background:#000b;
      color:#fff;border:1px solid #fff4;border-radius:10px;padding:9px 13px;font-size:12px;
      font-weight:800;cursor:pointer;z-index:6}
    #chatLog{position:fixed;right:18px;top:158px;width:min(320px,86vw);max-height:50vh;
      overflow-y:auto;background:#000c;border:1px solid #fff3;border-radius:14px;
      padding:10px;display:none;flex-direction:column;gap:8px;pointer-events:auto;z-index:6;
      backdrop-filter:blur(8px)}
    #chatLog.open{display:flex}
    #chatLog .empty{color:#fff9;font-size:12px;text-align:center;padding:10px 4px}
    .msg{max-width:85%;padding:8px 12px;border-radius:13px;font-size:13px;line-height:1.35;
      word-wrap:break-word}
    .msg .who{font-size:10px;opacity:.75;margin-bottom:2px;font-weight:800;
      letter-spacing:.03em;text-transform:uppercase}
    .msg.user{align-self:flex-end;background:#2f6fed;color:#fff;border-bottom-right-radius:4px}
    .msg.npc{align-self:flex-start;background:#fff;color:#111;border-bottom-left-radius:4px}
    .controls{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
      display:flex;gap:8px;align-items:center;pointer-events:auto}
    button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}
    #start{background:#fff;color:#111}#stop{background:#000b;color:#fff;border:1px solid #fff5}
    button:disabled{opacity:.45;cursor:not-allowed}.tip{font-size:12px;text-shadow:0 1px 6px #000}
  </style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="top">
    <div><div class="title">ENGLISH STREET</div><div class="hint">WASD / Arrow keys • Speak naturally</div></div>
    <div id="status">OFFLINE</div>
  </div>
  <button id="chatLogToggle">💬 CHAT LOG</button>
  <div id="chatLog"><div class="empty">Conversation transcript will appear here.</div></div>
  <div id="geminiKeyBox" style="position:absolute;right:18px;top:58px;pointer-events:auto;display:flex;gap:6px;align-items:center;background:#0009;padding:8px;border-radius:12px;">
    <input id="geminiKey" type="password" placeholder="Gemini API key" autocomplete="off"
      style="width:230px;padding:9px 10px;border:0;border-radius:9px;outline:none;">
    <button id="saveKey" style="padding:9px 12px;background:#fff;color:#111;">SAVE</button>
  </div>
  <div id="npcBox">
    <span>👋 <span id="npcName">NPC</span></span>
    <button id="talk">💬 TALK</button>
  </div>
  <div id="subtitle">Walk toward someone on the street.</div>
  <div class="controls">
    <button id="start">🎤 START GEMINI LIVE</button>
    <button id="stop" disabled>STOP</button>
    <span class="tip">Walk with WASD</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "@google/genai": "https://esm.sh/@google/genai@1.17.0"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GoogleGenAI, Modality } from "@google/genai";

const GEMINI_MODEL = "gemini-3.1-flash-live-preview";
let geminiApiKey = "";
let session = null;
let micStream = null;
let audioContext = null;
let micSource = null;
let processor = null;
let silentGain = null;
let playbackContext = null;
let nextPlayTime = 0;
let activeNPC = null;

const app = document.getElementById("app");
const status = document.getElementById("status");
const subtitle = document.getElementById("subtitle");
const start = document.getElementById("start");
const stop = document.getElementById("stop");
const npcBox = document.getElementById("npcBox");
const npcName = document.getElementById("npcName");
const talk = document.getElementById("talk");
const chatLog = document.getElementById("chatLog");
const chatLogToggle = document.getElementById("chatLogToggle");

let chatOpen = false;
let userTurnBuffer = "";
let npcTurnBuffer = "";

function currentNPCLabel(){
  return activeNPC ? activeNPC.name : "Stranger";
}

function addChatMessage(who, text){
  if(!text || !text.trim()) return;
  if(chatLog.querySelector(".empty")) chatLog.innerHTML = "";
  const el = document.createElement("div");
  el.className = "msg " + (who === "You" ? "user" : "npc");
  const whoEl = document.createElement("div");
  whoEl.className = "who";
  whoEl.textContent = who;
  const textEl = document.createElement("div");
  textEl.textContent = text.trim();
  el.appendChild(whoEl);
  el.appendChild(textEl);
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function finalizeTurn(){
  if(userTurnBuffer.trim()) addChatMessage("You", userTurnBuffer);
  if(npcTurnBuffer.trim()) addChatMessage(currentNPCLabel(), npcTurnBuffer);
  userTurnBuffer = "";
  npcTurnBuffer = "";
}

chatLogToggle.onclick = () => {
  chatOpen = !chatOpen;
  chatLog.classList.toggle("open", chatOpen);
  chatLogToggle.textContent = chatOpen ? "💬 HIDE LOG" : "💬 CHAT LOG";
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc7e8);
scene.fog = new THREE.Fog(0x9fc7e8, 35, 100);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 200);
camera.position.set(0,5,9);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(20,30,10);
sun.castShadow = true;
scene.add(sun);

function box(w,h,d,x,y,z,color){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color,roughness:.9})
  );
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  return m;
}

box(18,.2,80,0,-.1,-20,0x40444a);
box(5,.3,80,-11.5,0,-20,0xb9b1a4);
box(5,.3,80,11.5,0,-20,0xb9b1a4);
box(7,.2,80,-17.5,0,-20,0x6f9b61);
box(7,.2,80,17.5,0,-20,0x6f9b61);

for(let z=18;z>-58;z-=6) box(.25,.03,3,0,.03,z,0xf4e6b3);

function building(x,z,color,h){
  box(7,h,8,x,h/2,z,color);
  for(let y=2;y<h-.5;y+=2)
    for(let dx=-2;dx<=2;dx+=2)
      box(.8,1,.08,x+dx,y,z-4.05,0x9ed1dc);
}
building(-16,10,0xcdb79c,8); building(16,4,0x9daab5,9);
building(-16,-10,0xb8a2a0,10); building(16,-14,0xd2c0a0,7);
building(-16,-30,0xaeb8a4,8); building(16,-34,0xc0a8a0,9);

function person(color,x,z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.45,1,6,12),
    new THREE.MeshStandardMaterial({color})
  );
  body.position.y=1; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.38,16,12),
    new THREE.MeshStandardMaterial({color:0xe0b28f})
  );
  head.position.y=2; head.castShadow=true; g.add(head);
  g.position.set(x,0,z); scene.add(g); return g;
}

const player=person(0x315a9b,0,5);
const npcs=[
  { mesh: person(0xc15f4a,-5,-4), name:"Alex", role:"local person", scenario:"casual street conversation" },
  { mesh: person(0x4f8f66,5,-10), name:"Mia", role:"person going for coffee", scenario:"casual street conversation" },
  { mesh: person(0x8065a9,-4,-22), name:"Sam", role:"traveler", scenario:"casual street conversation" }
];

let nearbyNPC=null;
let conversation=null;

function setNearbyNPC(npc){
  if(nearbyNPC === npc) return;
  nearbyNPC=npc;
  npcName.textContent=npc.name;
  npcBox.style.display="flex";
  subtitle.textContent=`You're near ${npc.name}. Press TALK to start a natural conversation.`;
}

function clearNearbyNPC(){
  if(!nearbyNPC) return;
  nearbyNPC=null;
  npcBox.style.display="none";
  if(!conversation) subtitle.textContent="Walk toward someone on the street.";
}

talk.disabled=true;

const geminiKeyInput = document.getElementById("geminiKey");
const saveKeyBtn = document.getElementById("saveKey");

geminiKeyInput.value = localStorage.getItem("gemini_api_key") || "AQ.Ab8RN6IhkgfA25BUA_jgZUgBHl9LXsIsIiaQ_lSAVuryPKMZqw";
geminiApiKey = geminiKeyInput.value.trim();

saveKeyBtn.onclick = () => {
  geminiApiKey = geminiKeyInput.value.trim();
  if (!geminiApiKey) {
    subtitle.textContent = "Paste your Gemini API key first.";
    return;
  }
  localStorage.setItem("gemini_api_key", geminiApiKey);
  subtitle.textContent = "Gemini key saved. Press START TALKING.";
};

const keys=new Set();
addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));

function move(dt){
  let x=0,z=0;
  if(keys.has("w")||keys.has("arrowup"))z--;
  if(keys.has("s")||keys.has("arrowdown"))z++;
  if(keys.has("a")||keys.has("arrowleft"))x--;
  if(keys.has("d")||keys.has("arrowright"))x++;
  const len=Math.hypot(x,z)||1;
  player.position.x=Math.max(-8,Math.min(8,player.position.x+x/len*dt*4.5));
  player.position.z=Math.max(-48,Math.min(12,player.position.z+z/len*dt*4.5));

  let closest=null, best=Infinity;
  for(const npc of npcs){
    const d=player.position.distanceTo(npc.mesh.position);
    if(d<best){best=d;closest=npc;}
  }
  if(best<3.2) setNearbyNPC(closest);
  else clearNearbyNPC();

  camera.position.lerp(new THREE.Vector3(player.position.x,5,player.position.z+8.5),.08);
  camera.lookAt(player.position.x,1.5,player.position.z);
}

function bytesToBase64(bytes){
  let binary="";
  const chunkSize=0x8000;
  for(let i=0;i<bytes.length;i+=chunkSize){
    binary += String.fromCharCode(...bytes.subarray(i, Math.min(i+chunkSize, bytes.length)));
  }
  return btoa(binary);
}

function floatTo16BitPCM(float32){
  const out = new Int16Array(float32.length);
  for(let i=0;i<float32.length;i++){
    const s=Math.max(-1,Math.min(1,float32[i]));
    out[i]=s<0?s*0x8000:s*0x7fff;
  }
  return new Uint8Array(out.buffer);
}

function base64ToBytes(base64){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function playPCM24k(base64){
  const bytes=base64ToBytes(base64);
  const samples=new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength/2));
  if(!playbackContext) playbackContext=new AudioContext({sampleRate:24000});
  const buffer=playbackContext.createBuffer(1,samples.length,24000);
  const channel=buffer.getChannelData(0);
  for(let i=0;i<samples.length;i++) channel[i]=samples[i]/32768;
  const source=playbackContext.createBufferSource();
  source.buffer=buffer;
  source.connect(playbackContext.destination);
  const now=playbackContext.currentTime;
  nextPlayTime=Math.max(nextPlayTime,now);
  source.start(nextPlayTime);
  nextPlayTime += buffer.duration;
}

function clearPlayback(){
  if(playbackContext) nextPlayTime=playbackContext.currentTime;
}

async function startMicrophone(){
  micStream=await navigator.mediaDevices.getUserMedia({
    audio:{
      channelCount:1,
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    }
  });

  audioContext=new AudioContext();
  await audioContext.resume();

  micSource=audioContext.createMediaStreamSource(micStream);
  processor=audioContext.createScriptProcessor(4096,1,1);
  silentGain=audioContext.createGain();
  silentGain.gain.value=0;

  processor.onaudioprocess=(event)=>{
    if(!session) return;
    const input=event.inputBuffer.getChannelData(0);
    const pcm=floatTo16BitPCM(input);
    session.sendRealtimeInput({
      audio:{
        data:bytesToBase64(pcm),
        mimeType:`audio/pcm;rate=${audioContext.sampleRate}`
      }
    });
  };

  micSource.connect(processor);
  processor.connect(silentGain);
  silentGain.connect(audioContext.destination);
}

async function stopMicrophone(){
  try{ processor?.disconnect(); }catch{}
  try{ micSource?.disconnect(); }catch{}
  try{ silentGain?.disconnect(); }catch{}
  processor=null; micSource=null; silentGain=null;
  if(micStream){
    micStream.getTracks().forEach(t=>t.stop());
    micStream=null;
  }
  if(audioContext){
    await audioContext.close().catch(()=>{});
    audioContext=null;
  }
}

async function startConversation(targetNPC=null){
  if(!geminiApiKey){
    subtitle.textContent="Enter your Gemini API key in the box above first.";
    geminiKeyInput.focus();
    return;
  }

  try{
    status.textContent="CONNECTING...";
    subtitle.textContent=targetNPC
      ? `Connecting to ${targetNPC.name}...`
      : "Connecting to Gemini Live...";
    start.disabled=true;
    talk.disabled=true;
    activeNPC=targetNPC;
    userTurnBuffer="";
    npcTurnBuffer="";

    const ai=new GoogleGenAI({apiKey:geminiApiKey});

    const npcContext=targetNPC
      ? `You are ${targetNPC.name}, a ${targetNPC.role}. Scenario: ${targetNPC.scenario}.`
      : "You are a friendly person on an English-speaking city street.";

    session=await ai.live.connect({
      model:GEMINI_MODEL,
      config:{
        responseModalities:[Modality.AUDIO],
        inputAudioTranscription:{},
        outputAudioTranscription:{},
        thinkingConfig:{thinkingLevel:"minimal"},
        systemInstruction:{
          parts:[{
            text:`${npcContext}
You are a natural real-time conversation partner for a 3D street English practice game.
Speak naturally and concisely. Use English by default, but understand Vietnamese and English.
If the player speaks Vietnamese, you may reply in Vietnamese when helpful.
Keep the conversation casual and interactive. Do not describe your internal reasoning.
Do not say you are an AI unless directly asked.`
          }]
        }
      },
      callbacks:{
        onopen(){
          status.textContent="CONNECTED";
          stop.disabled=false;
          subtitle.textContent=targetNPC
            ? `You're talking with ${targetNPC.name}. Speak naturally.`
            : "Connected. Speak naturally.";
        },
        onmessage(message){
          try{
            const sc=message.serverContent;

            if(sc?.inputTranscription?.text){
              userTurnBuffer += sc.inputTranscription.text;
              subtitle.textContent="You: "+userTurnBuffer;
            }
            if(sc?.outputTranscription?.text){
              npcTurnBuffer += sc.outputTranscription.text;
              subtitle.textContent=npcTurnBuffer;
            }

            const parts=sc?.modelTurn?.parts || [];
            for(const part of parts){
              const data=part?.inlineData?.data || part?.inline_data?.data;
              const mime=part?.inlineData?.mimeType || part?.inline_data?.mimeType || "";
              if(data && mime.startsWith("audio/")){
                playPCM24k(data);
              }
            }

            if(sc?.turnComplete){
              finalizeTurn();
            }

            if(sc?.interrupted){
              finalizeTurn();
              clearPlayback();
              subtitle.textContent="Listening...";
            }
          }catch(err){
            console.warn("Gemini message handling:",err);
          }
        },
        onerror(e){
          console.error(e);
          status.textContent="ERROR";
          subtitle.textContent="Gemini Live error: "+(e?.message||"check API key, billing and microphone permission.");
          start.disabled=false;
          stop.disabled=true;
          talk.disabled=false;
          stopMicrophone();
          session=null;
        },
        onclose(e){
          console.log("Gemini Live closed:",e);
          status.textContent="OFFLINE";
          start.disabled=false;
          stop.disabled=true;
          talk.disabled=false;
          session=null;
          stopMicrophone();
        }
      }
    });

    await startMicrophone();

  }catch(e){
    console.error(e);
    status.textContent="ERROR";
    start.disabled=false;
    stop.disabled=true;
    talk.disabled=false;
    subtitle.textContent=e?.message || "Cannot start Gemini Live.";
    session=null;
    await stopMicrophone();
  }
}

start.onclick=()=>startConversation(nearbyNPC);
talk.onclick=()=>startConversation(nearbyNPC);

stop.onclick=async()=>{
  finalizeTurn();
  try{
    session?.sendRealtimeInput?.({audioStreamEnd:true});
  }catch{}
  try{session?.close?.();}catch{}
  session=null;
  await stopMicrophone();
  status.textContent="OFFLINE";
  start.disabled=false;
  stop.disabled=true;
  talk.disabled=false;
  npcBox.style.display=nearbyNPC ? "flex" : "none";
  subtitle.textContent=nearbyNPC
    ? `You're near ${nearbyNPC.name}. Press TALK to start a natural conversation.`
    : "Walk toward someone on the street.";
};

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05); last=now;
  move(dt);
  npcs.forEach((n,i)=>n.mesh.rotation.y=Math.sin(now*.0006+i)*.08);
  renderer.render(scene,camera);
}
loop(performance.now());
</script>
</body>
</html>
